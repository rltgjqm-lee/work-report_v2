name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/worker/**"
      # npm workspaces라 Worker 의존성 버전도 루트 lock 파일에 기록된다
      - "package-lock.json"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # lock 파일이 저장소 루트 하나뿐이라(npm workspaces) 설치는 루트에서 한다
      - run: npm ci
        working-directory: .

      - run: npx tsc --noEmit

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
